server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy para o serviço de gerenciamento do banco (porta 8004)
    location /gerenciamento_banco/ {
        proxy_pass http://controller-gerenciamento-banco:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy para o serviço de ingestão (porta 8001)
    location /ingestao/ {
        proxy_pass http://controller-ingestao:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy para o serviço de cruzamento ASG (porta 8002)
    location /cruzamento_asg/ {
        proxy_pass http://controller-cruzamento-asg:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy para o serviço de busca semântica (porta 8003)
    location /busca_semantica/ {
        proxy_pass http://controller-busca-semantica:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
